<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>商品分类｜MC MALL</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/commerce.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body data-page="category">
  <div class="app-shell app-shell--viewport">
    <header class="site-header category-header">
      <a class="icon-btn" href="index.html" aria-label="返回首页" data-icon="back"></a>
      <form class="top-search top-search--compact" role="search" data-search-form>
        <span class="top-search__icon" data-icon="search" aria-hidden="true"></span>
        <label class="sr-only" for="category-search">搜索分类或商品</label>
        <input class="input top-search__input" id="category-search" name="q" type="search" placeholder="搜索分类或商品" autocomplete="off">
      </form>
    </header>

    <main class="category-page" id="main-content"></main>

    <nav class="bottom-nav" aria-label="底部导航" data-bottom-nav></nav>
    <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast-root></div>
  </div>

  <script src="scripts/data.js" defer></script>
  <script src="scripts/app.js" defer></script>
</body>
</html>
