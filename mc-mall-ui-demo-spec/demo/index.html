<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>MC MALL｜校园服饰商城</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/commerce.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body data-page="home">
  <div class="app-shell">
    <header class="site-header home-header">
      <div class="home-header__main">
        <a class="brand" href="index.html" aria-label="MC MALL 首页">
          <img src="assets/icons/mc-logo.svg" width="64" height="31" alt="MC MALL">
        </a>
        <form class="top-search top-search--home" role="search" data-search-form>
          <span class="top-search__icon" data-icon="search" aria-hidden="true"></span>
          <label class="sr-only" for="home-search">搜索商品、学校或球队</label>
          <input class="input top-search__input" id="home-search" name="q" type="search" placeholder="搜索商品 / 学校 / 球队" autocomplete="off">
          <button class="top-search__camera" type="button" data-toast="拍照搜款暂不在本次 Demo 范围" aria-label="拍照搜款" data-icon="camera"></button>
        </form>
        <button class="icon-btn" type="button" data-toast="消息中心暂不在本次 Demo 范围" aria-label="消息中心" data-icon="message"></button>
      </div>
      <nav class="home-category-tabs" aria-label="首页商品频道">
        <a class="home-category-tab is-active" href="category.html?category=uniform-set" aria-current="page">校服</a>
        <a class="home-category-tab" href="category.html?category=sports">运动服</a>
        <a class="home-category-tab" href="category.html?category=uniform-set">制服</a>
        <a class="home-category-tab" href="category.html?category=custom">团队服</a>
        <a class="home-category-tab" href="category.html?category=accessories">配件</a>
      </nav>
    </header>

    <main class="page-content home-page" id="main-content"></main>

    <nav class="bottom-nav" aria-label="底部导航" data-bottom-nav></nav>
    <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast-root></div>
  </div>

  <script src="scripts/data.js" defer></script>
  <script src="scripts/app.js" defer></script>
</body>
</html>
